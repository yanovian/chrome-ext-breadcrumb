name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      - name: Verify zip artifact
        run: pnpm zip

      - name: Assert website is not in Chrome zip
        run: |
          file=$(ls .output/*-chrome.zip)
          if unzip -l "$file" | grep -qi 'website/'; then
            echo "website/ must not be packaged in $file"
            exit 1
          fi

      - name: Locate chrome zip
        id: chrome_zip
        run: |
          file=$(ls .output/*-chrome.zip)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          test -f "$file"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: breadcrumb-chrome-${{ github.sha }}
          path: ${{ steps.chrome_zip.outputs.file }}
          if-no-files-found: error

  website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      # Root tsconfig.json extends .wxt/tsconfig.json, which `wxt prepare`
      # generates. This job builds only the website, so it skips the
      # extension's own install/postinstall (model download, WASM copy) and
      # generates just that one file.
      - name: Prepare WXT types
        run: make website-prepare

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Lint website i18n
        working-directory: website
        run: pnpm lint-i18n

      - name: Build website
        working-directory: website
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build
